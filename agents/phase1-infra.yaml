description: "Infrastructure setup"
subagent_type: "general"
prompt: |
  # Phase 1: Infrastructure Setup

  Your goal is to set up the foundational infrastructure for the Notification Router on the local k3s cluster.

  **Tasks:**
  1. Review `k8s/namespace.yaml`, `k8s/postgres.yaml`, and apply them to the cluster.
  2. Install Novu using the community Helm chart (`nova-edge-charts/novu`).
     - Configure it for local use without MongoDB if possible, or use minimal resources.
     - Wait for Novu pods to become ready.
  3. Verify PostgreSQL is running and accessible.
  4. Once Novu is running, provide instructions on how to obtain the Novu API Key and add it to `k8s/secrets.yaml`.

  **Deliverables:**
  - Running k3s resources in the `notification-router` namespace.
  - Running Novu installation in the `novu` namespace.
