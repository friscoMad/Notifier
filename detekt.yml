# Detekt configuration — built-in defaults + formatting (replaces ktlint)
# buildUponDefaultConfig = true is set in Gradle, so all default rules are active.
# Thresholds are tuned for the existing codebase; formatting is added via detekt-formatting.

config:
  validation: true
  warningsAsErrors: false

# ── Complexity ────────────────────────────────────────────────────────────────

complexity:
  LongMethod:
    # handleSubscriptionSubmission suppressed at call site; keep threshold reasonable
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    # NovuService @Value constructor suppressed at call site; keep threshold reasonable
    constructorThreshold: 7
  CyclomaticComplexMethod:
    threshold: 25
  TooManyFunctions:
    thresholdInClasses: 20
  NestedBlockDepth:
    active: false

# ── Exceptions ────────────────────────────────────────────────────────────────
# TooGenericExceptionCaught: All remaining catch(e: Exception) blocks are at
# external SDK boundaries (Spring RestTemplate, Novu SDK, Slack SDK) where any
# exception type can occur. Making them specific would require catching multiple
# types per site from three different libraries without meaningful benefit.

exceptions:
  TooGenericExceptionCaught:
    active: false

# ── Performance ───────────────────────────────────────────────────────────────

performance:
  SpreadOperator:
    active: false

# ── Style ─────────────────────────────────────────────────────────────────────

style:
  ReturnCount:
    max: 6
  MagicNumber:
    # Magic numbers are fine in test code (status codes, counts, etc.)
    excludes: ["**/test/**"]
  UnusedPrivateProperty:
    # @Mock/@MockitoBean lateinit fields look unused to detekt but Mockito injects them
    excludes: ["**/test/**"]
  UnusedParameter:
    active: false
  MaxLineLength:
    maxLineLength: 200
  LoopWithTooManyJumpStatements:
    active: false

# ── Formatting (detekt-formatting wraps ktlint) ───────────────────────────────

formatting:
  active: true
  android: false
  autoCorrect: true
  MaximumLineLength:
    active: false
