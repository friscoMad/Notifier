apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-router-api
  namespace: notification-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-router-api
  template:
    spec:
      containers:
      - name: api
        image: notification-router/api:dev
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/notification_router"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: NOVU_API_URL
          value: "http://novu-api.novu.svc.cluster.local:3000"
        - name: NOVU_API_KEY
          valueFrom:
            secretKeyRef:
              name: notification-router-secrets
              key: novu-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: notification-router-api
  namespace: notification-router
spec:
  selector:
    app: notification-router-api
  ports:
  - port: 80
    targetPort: 8080
