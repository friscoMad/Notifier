description: "Slack bot development"
subagent_type: "general"
prompt: |
  # Phase 4: Slack Bot

  Your goal is to build the interactive Slack Bot using Kotlin.

  **Context:**
  - This bot handles user subscriptions to the Notification Router.
  - Review `docs/slack-commands.md` for details.

  **Tasks:**
  1. Initialize a Kotlin project in `bot/` using Gradle with the Slack Bolt SDK (`com.slack.api:bolt`).
  2. Implement the command listener for `/notifyme`.
     - Parse subcommands: `subscribe`, `unsubscribe`, `list`, `channel`, `help`.
  3. Integrate the bot with the core `api/` service via HTTP calls (e.g., using Retrofit, Ktor Client, or WebClient).
     - Fetch available notification types from the API.
     - Create user in the DB (via API) if they don't exist.
     - Send subscription requests to the API.
  4. Implement an interactive modal for subscribing when a user runs `/notifyme` with no arguments.
  5. Add unit tests for parsing the command arguments correctly.

  **Deliverables:**
  - Complete Slack Bolt application in `bot/`.
  - Configured to use Socket Mode for local development (`SLACK_APP_TOKEN` and `SLACK_BOT_TOKEN`).
