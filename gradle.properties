# =======================================================
# Gradle Environment Properties
# Best practices for build performance & reproducibility
# =======================================================

# --- Parallel and Caching ---
# Run tasks in parallel across projects
org.gradle.parallel=true

# Enable build cache (re-use outputs from previous builds)
org.gradle.caching=true

# Enable configuration caching (huge speedup on repeated builds)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# --- Daemon and Memory ---
# Enable the Gradle Daemon
org.gradle.daemon=true

# Set JVM args for the Gradle Daemon (Max memory 2GB, optimized GC)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Watch the file system to avoid full scans
org.gradle.vfs.watch=true

# --- Kotlin and Kapt ---
# Allocate memory to the Kotlin Daemon
kotlin.daemon.jvmargs=-Xmx2048m

# Enable incremental compilation for Kotlin
kotlin.incremental=true

# Ensure consistent Kotlin API and Language version if not set in build script
# kotlin.compiler.execution.strategy=in-process # (optional if daemon has issues)

# Keep the JVM running the Kotlin compiler alive
kotlin.daemon.useFallbackStrategy=false
