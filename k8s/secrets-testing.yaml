# K3s Testing Secrets Template
# Copy this file to k8s/secrets.yaml and update with your testing credentials

apiVersion: v1
kind: Secret
metadata:
  name: notification-router-secrets
  namespace: notification-router
type: Opaque
stringData:
  # Novu API Key - Get from http://localhost:3000 (after Novu installation)
  novu-api-key: "your-novu-api-key-here"
  
  # Slack Bot Token - Get from Slack API Console
  slack-bot-token: "xoxb-your-bot-token-here"
  
  # Slack App Token (for Socket Mode) - Get from Slack API Console
  slack-app-token: "xapp-your-app-token-here"
  
  # Slack Signing Secret - Get from Slack API Console
  slack-signing-secret: "your-slack-signing-secret-here"
  
  # GitHub Webhook Secret - Optional, for webhook validation
  github-webhook-secret: "your-github-webhook-secret-here"
  
  # Database credentials (should match k8s/postgres.yaml)
  database-username: "postgres"
  database-password: "postgres"
  
  # Test configuration
  test-environment: "k3s-testing"
  test-user-email: "test@example.com"
  test-user-id: "U123456789"
  
  # Optional: SMTP credentials for testing email notifications
  smtp-host: "smtp.gmail.com"
  smtp-port: "587"
  smtp-user: "your-email@gmail.com"
  smtp-pass: "your-email-password"
  
  # Optional: Other service credentials
  github-app-id: ""
  github-app-private-key: ""
  
# Note: For production, consider using Kubernetes secrets with base64 encoding
# This template uses stringData for easier testing setup