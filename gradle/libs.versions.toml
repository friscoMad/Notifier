[versions]
kotlin = "2.3.10"
springBoot = "4.0.3"
springDependencyManagement = "1.1.7"
ktlintPlugin = "14.0.1"
novuJava = "1.6.0"
slackBolt = "1.47.0"
mockitoKotlin = "6.2.3"
testcontainers = "2.0.3"
wiremock = "3.13.2"

[libraries]
# Spring Boot
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# Kotlin / Jackson
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
jackson2-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# Database
postgresql = { module = "org.postgresql:postgresql" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# Testing
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-flyway-test = { module = "org.springframework.boot:spring-boot-starter-flyway-test" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }

# Third-party SDKs
novu-java = { module = "co.novu:novu-java", version.ref = "novuJava" }
slack-bolt = { module = "com.slack.api:bolt", version.ref = "slackBolt" }
slack-bolt-jetty = { module = "com.slack.api:bolt-jetty", version.ref = "slackBolt" }
slack-bolt-jakarta-servlet = { module = "com.slack.api:bolt-jakarta-servlet", version.ref = "slackBolt" }
slack-bolt-socket-mode = { module = "com.slack.api:bolt-socket-mode", version.ref = "slackBolt" }
slack-api-model-kotlin-extension = { module = "com.slack.api:slack-api-model-kotlin-extension", version.ref = "slackBolt" }
slack-api-client-kotlin-extension = { module = "com.slack.api:slack-api-client-kotlin-extension", version.ref = "slackBolt" }
tyrus-standalone-client = { module = "org.glassfish.tyrus.bundles:tyrus-standalone-client", version = "1.19" }
javax-websocket-api = { module = "javax.websocket:javax.websocket-api", version = "1.1" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
