[versions]
kotlin = "2.3.10"
springBoot = "3.4.3"
springDependencyManagement = "1.1.7"
ktlintConfig = "1.8.0"
ktlintPlugin = "14.0.1"
jacksonKotlin = "2.18.2" # From Spring Boot, but good to have if needed standalone
flyway = "11.3.1"
postgresql = "42.7.5"
novuJava = "1.6.0"
slackBolt = "1.47.0"
mockitoKotlin = "6.2.3"
testcontainers = "1.20.4"
wiremock = "3.13.2"
h2 = "2.3.232"

[libraries]
# Spring Boot
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# Database
flyway-core = { module = "org.flywaydb:flyway-core" }
postgresql = { module = "org.postgresql:postgresql" }
h2 = { module = "com.h2database:h2" }

# Testing
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }

# Third-party SDKs
novu-java = { module = "co.novu:novu-java", version.ref = "novuJava" }
slack-bolt = { module = "com.slack.api:bolt", version.ref = "slackBolt" }
slack-bolt-jetty = { module = "com.slack.api:bolt-jetty", version.ref = "slackBolt" }
slack-bolt-jakarta-servlet = { module = "com.slack.api:bolt-jakarta-servlet", version.ref = "slackBolt" }
slack-bolt-socket-mode = { module = "com.slack.api:bolt-socket-mode", version.ref = "slackBolt" }
slack-api-model-kotlin-extension = { module = "com.slack.api:slack-api-model-kotlin-extension", version.ref = "slackBolt" }
slack-api-client-kotlin-extension = { module = "com.slack.api:slack-api-client-kotlin-extension", version.ref = "slackBolt" }
tyrus-standalone-client = { module = "org.glassfish.tyrus.bundles:tyrus-standalone-client", version = "1.19" }
javax-websocket-api = { module = "javax.websocket:javax.websocket-api", version = "1.1" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
