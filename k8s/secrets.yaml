apiVersion: v1
kind: Secret
metadata:
  name: notification-router-secrets
  namespace: notification-router
type: Opaque
stringData:
  # Base64 encoded or plaintext depending on how you apply it
  novu-api-key: "YOUR_NOVU_API_KEY"
  slack-bot-token: "xoxb-YOUR-BOT-TOKEN"
  slack-app-token: "xapp-YOUR-APP-TOKEN" # For Socket Mode
  slack-signing-secret: "YOUR_SIGNING_SECRET"
  github-webhook-secret: "YOUR_GITHUB_WEBHOOK_SECRET"
