description: "Novu workflows"
subagent_type: "general"
prompt: |
  # Phase 5: Novu Integration

  Your goal is to connect the Notification Router API to Novu and define the workflows.

  **Context:**
  - After receiving and filtering events, the API must trigger Novu workflows for delivery to users and channels.
  - Review `docs/architecture.md` and `docs/notification-types.md`.

  **Tasks:**
  1. Add the Novu Kotlin/Java SDK or a custom HTTP client to the `api/` project.
     - Provide a Novu API Key to the application via environment variables.
  2. Implement the `NotificationDeliveryService` in the `api/` project.
     - This service should take a `NormalizedEvent` and a list of `Subscribers` matching the filters.
     - Call the Novu API `trigger` endpoint with the event `typeKey` and the target subscriber IDs/channels.
  3. Write integration or mock tests to verify the payload sent to Novu.
  4. (Optional) Provide instructions or scripts to set up the corresponding Novu workflows (Digest step, Slack Provider) via the Novu UI or API.

  **Deliverables:**
  - The API triggers Novu workflows for filtered events.
  - Passing tests with mock Novu calls.
