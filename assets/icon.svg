<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep orange-to-amber diagonal gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#E8430A" />
      <stop offset="55%"  style="stop-color:#FF6B35" />
      <stop offset="100%" style="stop-color:#FFD23F" />
    </linearGradient>

    <!-- Radial spotlight behind the bolt -->
    <radialGradient id="spotlight" cx="52%" cy="45%" r="42%">
      <stop offset="0%"   style="stop-color:#FFFFFF;stop-opacity:0.22" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>

    <!-- Bolt inner gradient: pure white top, warm white bottom -->
    <linearGradient id="boltGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   style="stop-color:#FFFFFF" />
      <stop offset="100%" style="stop-color:#FFE8C0" />
    </linearGradient>

    <!-- Glow behind the bolt -->
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop shadow -->
    <filter id="boltShadow" x="-10%" y="-5%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#8B1A00" flood-opacity="0.45" />
    </filter>

    <!-- Soft glow for the caduceus -->
    <filter id="caduceusGlow" x="-30%" y="-15%" width="160%" height="130%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="roundedSquare">
      <rect width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" />

  <!-- Spotlight layer -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#spotlight)" />

  <!-- Subtle rim highlight -->
  <rect width="512" height="512" rx="112" ry="112"
        fill="none" stroke="white" stroke-width="3" stroke-opacity="0.15" />

  <!-- Glow halo behind bolt -->
  <path
    d="M298 54 L165 275 L238 275 L208 458 L347 237 L274 237 Z"
    fill="white" opacity="0.35"
    filter="url(#boltGlow)"
    clip-path="url(#roundedSquare)"
  />

  <!-- Main lightning bolt -->
  <path
    d="M298 54 L165 275 L238 275 L208 458 L347 237 L274 237 Z"
    fill="url(#boltGrad)"
    filter="url(#boltShadow)"
  />

  <!-- Sparks — top right -->
  <circle cx="348" cy="128" r="9"  fill="white" opacity="0.75" />
  <circle cx="374" cy="108" r="5"  fill="white" opacity="0.50" />
  <circle cx="365" cy="155" r="4"  fill="white" opacity="0.40" />

  <!-- Sparks — bottom left -->
  <circle cx="162" cy="384" r="7"  fill="white" opacity="0.60" />
  <circle cx="140" cy="362" r="4"  fill="white" opacity="0.35" />

  <!-- ═══════════════════════════════════════════════
       CADUCEUS — Mercury's herald staff (bottom-right)
       Staff runs y=318→442, centered x=392
       ═══════════════════════════════════════════════ -->
  <g filter="url(#caduceusGlow)">

    <!-- Staff rod -->
    <line x1="392" y1="318" x2="392" y2="442"
          stroke="white" stroke-width="6" stroke-linecap="round" />

    <!-- Left snake: S-curve, bulges left then right -->
    <path d="M 392,440 C 350,422 347,396 392,380 C 437,364 435,338 392,322"
          fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" />

    <!-- Right snake: mirror S-curve -->
    <path d="M 392,440 C 434,422 437,396 392,380 C 347,364 349,338 392,322"
          fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" />

    <!-- Left wing blade (filled crescent) -->
    <path d="M 392,323 C 372,305 346,303 330,314 C 340,324 365,325 390,328 Z"
          fill="white" />

    <!-- Right wing blade (filled crescent, mirror) -->
    <path d="M 392,323 C 412,305 438,303 454,314 C 444,324 419,325 394,328 Z"
          fill="white" />

    <!-- Top orb -->
    <circle cx="392" cy="314" r="8" fill="white" />

  </g>
</svg>
