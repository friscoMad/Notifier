version: '3.8'

x-novu-env: &novu-env
  NODE_ENV: local
  HOST_NAME: http://localhost
  # Ports
  API_PORT: 3000
  REDIS_PORT: 6379
  REDIS_CACHE_SERVICE_PORT: 6379
  WS_PORT: 3002
  # Root URL
  VITE_API_HOSTNAME: http://localhost:3000
  VITE_WEBSOCKET_HOSTNAME: http://localhost:3002
  # The VITE_LEGACY_DASHBOARD_URL must be set to the host and port of your web container.
  API_ROOT_URL: https://marguerite-dreamful-guillermina.ngrok-free.dev
  FRONT_BASE_URL: http://localhost:4000
  # Configuration
  IS_API_IDEMPOTENCY_ENABLED: 'false'
  IS_API_RATE_LIMITING_ENABLED: 'false'
  IS_NEW_MESSAGES_API_RESPONSE_ENABLED: 'true'
  IS_V2_ENABLED: 'true'
  IS_SLACK_TEAMS_ENABLED: 'true'
  # Secrets
  JWT_SECRET: "your-secret-jwt-key"
  SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: "15d"
  STORE_ENCRYPTION_KEY: "12345678901234567890123456789012"
  NOVU_SECRET_KEY: "12345678901234567890123456789012"
  # DB & Cache
  MONGO_MAX_POOL_SIZE: 10
  MONGO_MIN_POOL_SIZE: 5
  MONGO_URL: mongodb://root:secret@mongodb:27017/novu-db?authSource=admin
  MONGO_AUTO_CREATE_INDEXES: 'true'
  REDIS_HOST: redis

services:
  # ==========================================
  # Notification Router Database
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: router_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_router
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_router"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Novu Core Infrastructure
  # ==========================================
  redis:
    image: "redis:alpine"
    container_name: novu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0.17
    container_name: novu_mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=secret
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "root", "--password", "secret", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # Novu Microservices
  # ==========================================
  api:
    image: "ghcr.io/novuhq/novu/api:3.11.0"
    container_name: novu_api
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      <<: *novu-env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/v1/health-check || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  worker:
    image: "ghcr.io/novuhq/novu/worker:3.11.0"
    container_name: novu_worker
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      <<: *novu-env
      PORT: 3004
      API_ROOT_URL: https://marguerite-dreamful-guillermina.ngrok-free.dev
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3004/v1/health-check || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  ws:
    image: "ghcr.io/novuhq/novu/ws:3.11.0"
    container_name: novu_ws
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      <<: *novu-env
      PORT: 3002
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/v1/health-check || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  dashboard:
    image: "ghcr.io/novuhq/novu/dashboard:3.11.0"
    container_name: novu_dashboard
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      VITE_API_HOSTNAME: http://localhost:3000
      VITE_SELF_HOSTED: 'true'
      VITE_WEBSOCKET_HOSTNAME: http://localhost:3002
      VITE_LEGACY_DASHBOARD_URL: http://localhost:4000
    ports:
      - "4000:4000"

volumes:
  mongodb_data:
  postgres_data:
