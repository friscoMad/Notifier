spring:
  config:
    activate:
      on-profile: local
  application:
    name: notification-router-api
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_router
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate.ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

novu:
  api:
    url: http://localhost:3000/v1
    key: ${NOVU_API_KEY:nvsk.local_development_api_key_for_testing_purposes_only_12345}
---

spring:
  config:
    activate:
      on-profile: k8s
  application:
    name: notification-router-api
  datasource:
    url: jdbc:postgresql://postgres:5432/notification_router
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate.ddl-auto: none
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

flyway:
  url: jdbc:postgresql://postgres:5432/notification_router
  user: postgres
  password: postgres
  locations: classpath:db/migration

novu:
  api:
    url: http://novu-api.novu.svc.cluster.local:3000
    key: ${NOVU_API_KEY}
---

spring:
  config:
    activate:
      on-profile: k8s-testing
  application:
    name: notification-router-api
  datasource:
    url: jdbc:postgresql://postgres:5432/notification_router
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate.ddl-auto: none
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

flyway:
  url: jdbc:postgresql://postgres:5432/notification_router
  user: postgres
  password: postgres
  locations: classpath:db/migration

novu:
  api:
    url: http://novu-api.novu.svc.cluster.local:3000
    key: ${NOVU_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

server:
  port: 8080

logging:
  level:
    com.notifier.router: DEBUG