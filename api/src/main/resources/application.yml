spring:
  config:
    activate:
      on-profile: local
  application:
    name: notification-router-api
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_router
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  web:
    resources:
      add-mappings: false

server:
  port: 8082

app:
  seeder:
    # Set to true to wipe all subscriptions/users and clean up Novu on startup.
    # false (default): only re-seeds static notification types and filter definitions.
    full-reset: true

buildkite:
  webhook:
    token: ${BUILDKITE_WEBHOOK_TOKEN:}

novu:
  api:
    url: http://localhost:3000/v1
    key: nvsk.local_development_api_key_for_testing_purposes_only_12345
  slack:
    client-id: ${SLACK_CLIENT_ID:}
    client-secret: ${SLACK_CLIENT_SECRET:}
    application-id: ${SLACK_APP_ID:}
